<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>Owen.Ai Chat</title>
  <style>
    :root {
      --bg: #0f1226;
      --panel: #171a35;
      --panel-soft: #1f2447;
      --accent: #7c5cff;
      --accent-2: #24d2ff;
      --text: #eef1ff;
      --muted: #a9b2dd;
      --user: #2b63ff;
      --bot: #c23cff;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 700px at 10% -10%, #2f2a7f 0%, transparent 60%),
                  radial-gradient(1000px 700px at 100% 0%, #0d6e8f 0%, transparent 55%),
                  var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(920px, 100%);
      height: min(88vh, 760px);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      animation: fadeInUp 450ms ease;
    }

    .header {
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .chat-controls { display: flex; gap: 8px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #44ffb0;
      box-shadow: 0 0 12px #44ffb0;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .subtitle {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    .auth {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .welcome {
      font-size: 12px;
      color: var(--muted);
    }

    #chatbox {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 80%;
      padding: 10px 12px;
      border-radius: 14px;
      line-height: 1.45;
      animation: fadeInUp 240ms ease;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(180deg, #3f77ff, #2d5bf0);
      border: 1px solid rgba(255,255,255,0.16);
    }

    .msg.bot {
      align-self: stretch;
      max-width: 100%;
      padding: 2px 4px;
      background: transparent;
      border: none;
      color: #d9e0ff;
    }

    .msg.error {
      align-self: flex-start;
      background: rgba(255, 107, 107, 0.18);
      border: 1px solid rgba(255, 107, 107, 0.45);
      color: #ffdcdc;
    }

    .typing {
      display: none;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      margin: 2px 0 0 4px;
    }

    .typing.show {
      display: flex;
      animation: fadeInUp 200ms ease;
    }

    .typing .bubble {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      opacity: 0.45;
      animation: bounce 900ms infinite ease-in-out;
    }

    .typing .bubble:nth-child(2) {
      animation-delay: 150ms;
    }

    .typing .bubble:nth-child(3) {
      animation-delay: 300ms;
    }

    .composer {
      border-top: 1px solid rgba(255,255,255,0.12);
      padding: 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      background: rgba(6, 8, 22, 0.45);
    }
    .composer-wrap { border-top: 1px solid rgba(255,255,255,0.12); background: rgba(6, 8, 22, 0.45); }
    .attachments-preview { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px 0; }
    .attach-chip {
      background: #1a214d;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 12px;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-btn {
      padding: 0 12px;
    }

    .icon-btn[hidden] {
      display: none;
    }

    #userInput {
      width: 100%;
      height: 50px;
      background: #111533;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      padding: 0 14px;
      font-size: 15px;
      line-height: 50px;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    #userInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.23);
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 16px;
      color: white;
      font-weight: 600;
      font-size: 14px;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    #sendBtn,
    #imageBtn {
      height: 44px;
      line-height: 44px;
      padding-top: 0;
      padding-bottom: 0;
    }

    #sendBtn {
      min-width: 56px;
      padding: 0 10px;
      font-size: 12px;
    }

    .tokens {
      font-size: 12px;
      color: var(--muted);
      padding: 0 14px 10px;
      text-align: right;
    }

    .code-block {
      margin: 10px 0;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      overflow: hidden;
      background: #0f132f;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      background: #1a214d;
      font-size: 12px;
    }

    .copy-code {
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      min-width: 74px;
    }

    .code-block pre {
      margin: 0;
      padding: 10px 12px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.45;
      color: #e9eeff;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-4px);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1 class="title">Owen.Ai</h1>
          <p class="subtitle">Friendly • Playful • Helpful</p>
        </div>
      </div>
      <div class="chat-controls">
        <select id="chatSelect"></select>
        <button id="newChatBtn" type="button">New Chat</button>
      </div>
      <div class="auth">
        <span id="welcomeUser" class="welcome"></span>
        <button id="loginBtn" onclick="goToLogin()">Login / Sign up</button>
      </div>
    </header>

    <section id="chatbox"></section>

    <div id="typingIndicator" class="typing" aria-live="polite">
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span>Owen is thinking…</span>
    </div>

    <div class="composer-wrap">
    <div id="attachmentsPreview" class="attachments-preview"></div>
    <div class="composer">
      <input id="fileInput" type="file" hidden onchange="handleFile(event)" />
      <button class="icon-btn" id="fileBtn" onclick="pickFile()" title="Upload file" hidden>📎</button>
      <input
        id="userInput"
        placeholder="Message Owen.Ai…"
        onkeydown="if(event.key==='Enter') sendMessage();"
      />
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
    </div>
    <div class="tokens" id="tokensLeft">Tokens left: 700</div>
  </main>

  <script>
    const chatbox = document.getElementById("chatbox");
    const typingIndicator = document.getElementById("typingIndicator");
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const welcomeUser = document.getElementById("welcomeUser");
    const loginBtn = document.getElementById("loginBtn");
    const chatSelect = document.getElementById("chatSelect");
    const newChatBtn = document.getElementById("newChatBtn");
    const fileBtn = document.getElementById("fileBtn");
    const fileInput = document.getElementById("fileInput");
    const attachmentsPreview = document.getElementById("attachmentsPreview");
    const tokensLeft = document.getElementById("tokensLeft");
    const MAX_OUTPUT_TOKENS = 700;
    let isLoading = false;
    let currentUser = localStorage.getItem("owen_user") || "";
    let currentDisplayName = localStorage.getItem("owen_user_name") || currentUser;
    let pendingImage = null;
    let pendingFile = null;
    let currentChatId = "";

    function isLoggedIn() {
      return Boolean(currentUser);
    }

    function historyKey() {
      return `owen_chats_${currentUser}`;
    }
    function chatsIndexKey() {
      return `owen_chat_index_${currentUser}`;
    }
    function getChatIndex() {
      try { return JSON.parse(localStorage.getItem(chatsIndexKey()) || "[]"); } catch { return []; }
    }
    function saveChatIndex(index) {
      localStorage.setItem(chatsIndexKey(), JSON.stringify(index));
    }
    function createChat() {
      const id = `chat_${Date.now()}`;
      const index = getChatIndex();
      index.unshift({ id, title: "New chat", updatedAt: Date.now() });
      saveChatIndex(index.slice(0, 30));
      const chats = JSON.parse(localStorage.getItem(historyKey()) || "{}");
      chats[id] = [];
      localStorage.setItem(historyKey(), JSON.stringify(chats));
      currentChatId = id;
      renderChatSelector();
      renderHistory();
    }
    function renderChatSelector() {
      if (!isLoggedIn()) return;
      const index = getChatIndex();
      chatSelect.innerHTML = "";
      index.forEach(chat => {
        const opt = document.createElement("option");
        opt.value = chat.id;
        opt.textContent = chat.title;
        chatSelect.appendChild(opt);
      });
      chatSelect.value = currentChatId || index[0]?.id || "";
    }

    function renderHistory() {
      chatbox.innerHTML = "";
      if (!isLoggedIn()) return;
      const raw = localStorage.getItem(historyKey()) || "{}";
      try {
        const allChats = JSON.parse(raw);
        const items = allChats[currentChatId] || [];
        if (!Array.isArray(items)) return;
        items.forEach(item => appendMessage(item.role, item.text, item.type || "", false));
      } catch (error) {
        // Ignore invalid local history.
      }
    }

    function saveMessage(role, text, type = "") {
      if (!isLoggedIn()) return;
      const raw = localStorage.getItem(historyKey()) || "{}";
      let items = [];
      try {
        const allChats = JSON.parse(raw);
        items = Array.isArray(allChats[currentChatId]) ? allChats[currentChatId] : [];
      } catch (error) {
        items = [];
      }
      items.push({ role, text, type, ts: Date.now() });
      items = items.slice(-100);
      const allChats = JSON.parse(localStorage.getItem(historyKey()) || "{}");
      allChats[currentChatId] = items;
      localStorage.setItem(historyKey(), JSON.stringify(allChats));
      const index = getChatIndex();
      const firstUserMsg = items.find(x => x.role === "You" && x.text)?.text || "New chat";
      const existing = index.find(x => x.id === currentChatId);
      if (existing) {
        existing.title = firstUserMsg.slice(0, 28);
        existing.updatedAt = Date.now();
      }
      saveChatIndex(index.sort((a, b) => b.updatedAt - a.updatedAt));
      renderChatSelector();
    }

    function refreshAuthUi() {
      const loggedIn = isLoggedIn();
      welcomeUser.textContent = loggedIn ? `Hi, ${currentDisplayName}` : "Guest mode";
      fileBtn.hidden = !loggedIn;
      loginBtn.hidden = loggedIn;
      chatSelect.hidden = !loggedIn;
      newChatBtn.hidden = !loggedIn;
    }

    function goToLogin() {
      window.location.href = "/login";
    }

    function renderAssistantMessage(div, text) {
      div.textContent = "";
      const regex = /```([\w-]*)\n([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;
      while ((match = regex.exec(text)) !== null) {
        const plain = text.slice(lastIndex, match.index);
        if (plain) div.appendChild(document.createTextNode(plain));

        const lang = match[1] || "code";
        const code = match[2] || "";
        const wrap = document.createElement("div");
        wrap.className = "code-block";
        const header = document.createElement("div");
        header.className = "code-header";
        const label = document.createElement("span");
        label.textContent = lang;
        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-code";
        copyBtn.textContent = "Copy code";
        copyBtn.onclick = async () => {
          await navigator.clipboard.writeText(code);
          copyBtn.textContent = "Copied!";
          setTimeout(() => { copyBtn.textContent = "Copy code"; }, 1200);
        };
        header.append(label, copyBtn);
        const pre = document.createElement("pre");
        pre.textContent = code;
        wrap.append(header, pre);
        div.appendChild(wrap);
        lastIndex = regex.lastIndex;
      }
      const tail = text.slice(lastIndex);
      if (tail) div.appendChild(document.createTextNode(tail));
    }

    function appendMessage(role, text, type = "", save = true) {
      const div = document.createElement("div");
      const baseClass = role === "You" ? "msg user" : "msg bot";
      div.className = type === "error" ? "msg error" : baseClass;
      if (role === "You" || type === "error") {
        div.textContent = text;
      } else {
        renderAssistantMessage(div, text);
      }
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
      if (save) saveMessage(role, text, type);
      return div;
    }

    function updateTokensLeft(used = 0) {
      const remaining = Math.max(0, MAX_OUTPUT_TOKENS - Number(used || 0));
      tokensLeft.textContent = `Tokens left: ${remaining}`;
    }

    function appendImagePreview(dataUrl, save = true) {
      const div = document.createElement("div");
      div.className = "msg user";
      const img = document.createElement("img");
      img.src = dataUrl;
      img.alt = "Uploaded image";
      img.style.maxWidth = "240px";
      img.style.borderRadius = "10px";
      img.style.display = "block";
      div.appendChild(img);
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
      if (save && isLoggedIn()) saveMessage("You", "[Image]", "image");
    }

    function setLoading(loading) {
      isLoading = loading;
      sendBtn.disabled = loading;
      input.disabled = loading;
      typingIndicator.classList.toggle("show", loading);
      if (!loading) input.focus();
    }

    function pickFile() {
      if (!isLoggedIn()) return;
      fileInput.click();
    }
    function renderAttachmentChips() {
      attachmentsPreview.innerHTML = "";
      if (pendingImage?.fileName) {
        const chip = document.createElement("div");
        chip.className = "attach-chip";
        chip.textContent = `🖼 ${pendingImage.fileName}`;
        attachmentsPreview.appendChild(chip);
      }
      if (pendingFile?.name) {
        const chip = document.createElement("div");
        chip.className = "attach-chip";
        chip.textContent = `📄 ${pendingFile.name}`;
        attachmentsPreview.appendChild(chip);
      }
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handleFile(event) {
      if (!isLoggedIn()) return;
      const file = event.target.files?.[0];
      if (!file) return;
      pendingFile = { name: file.name || "file" };
      if (file.type && file.type.startsWith("image/")) {
        const dataUrl = await readFileAsDataUrl(file);
        const base64 = String(dataUrl).split(",")[1] || "";
        pendingImage = {
          fileName: file.name || "image",
          mimeType: file.type || "image/png",
          data: base64,
          preview: dataUrl
        };
      } else {
        pendingImage = null;
      }
      renderAttachmentChips();
    }

    async function sendMessage() {
      if (isLoading) return;

      const message = input.value.trim();
      if (!message && !pendingImage) return;

      if (message) appendMessage("You", message);
      if (pendingImage?.preview) appendImagePreview(pendingImage.preview);
      if (pendingFile?.name) appendMessage("You", `📎 ${pendingFile.name}`);
      input.value = "";
      setLoading(true);

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            user: currentUser || "guest",
            image: pendingImage ? { mimeType: pendingImage.mimeType, data: pendingImage.data } : null,
            fileName: pendingFile?.name || null
          })
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          appendMessage("Owen.Ai", data.reply || "Sorry—something went wrong.", "error");
          return;
        }
        const botDiv = appendMessage("Owen.Ai", "", "", false);
        let fullText = "";
        let buffer = "";
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop() || "";
          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const payload = line.slice(6).trim();
            if (!payload || payload === "[DONE]") continue;
            const chunk = JSON.parse(payload);
            if (chunk.delta) {
              fullText += chunk.delta;
              renderAssistantMessage(botDiv, fullText);
              chatbox.scrollTop = chatbox.scrollHeight;
            }
            if (chunk.usedOutputTokens !== undefined) updateTokensLeft(chunk.usedOutputTokens);
          }
        }
        saveMessage("Owen.Ai", fullText, "");
      } catch (error) {
        appendMessage("Owen.Ai", "Sorry—there was a network error.", "error");
      } finally {
        pendingImage = null;
        pendingFile = null;
        attachmentsPreview.innerHTML = "";
        fileInput.value = "";
        setLoading(false);
      }
    }

    window.onload = () => {
      refreshAuthUi();
      if (isLoggedIn()) {
        const index = getChatIndex();
        if (!index.length) createChat();
        currentChatId = index[0]?.id || currentChatId;
        renderChatSelector();
      }
      renderHistory();

      const firstMessage = localStorage.getItem("firstMessage");
      if (firstMessage) {
        localStorage.removeItem("firstMessage");
        input.value = firstMessage;
        sendMessage();
      }
    };

    document.addEventListener("paste", async event => {
      if (!isLoggedIn()) return;
	      const items = event.clipboardData?.items || [];
      for (const item of items) {
        if (item.type && item.type.startsWith("image/")) {
          const file = item.getAsFile();
          if (!file) return;
          const dataUrl = await readFileAsDataUrl(file);
          const base64 = String(dataUrl).split(",")[1] || "";
	          pendingImage = {
            fileName: file.name || "pasted-image",
            mimeType: file.type || "image/png",
            data: base64,
            preview: dataUrl
	          };
            pendingFile = { name: file.name || "pasted-image.png" };
	          renderAttachmentChips();
          event.preventDefault();
          return;
        }
      }
	    });
      chatSelect.addEventListener("change", () => {
        currentChatId = chatSelect.value;
        renderHistory();
      });
      newChatBtn.addEventListener("click", createChat);

  </script>
</body>
</html>
