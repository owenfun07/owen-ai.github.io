<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>Owen AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      color: #eef1ff;
      background: radial-gradient(1200px 700px at 10% -10%, #2f2a7f 0%, transparent 60%),
                  radial-gradient(1000px 700px at 100% 0%, #0d6e8f 0%, transparent 55%),
                  #0f1226;
    }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 280px minmax(0, 1fr); transition: grid-template-columns 180ms ease; }
    .shell.sidebar-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
    .shell.guest { grid-template-columns: 1fr; }
    .home-sidebar {
      grid-column: 1;
      background: rgba(16, 17, 20, 0.96);
      border-right: 1px solid rgba(255,255,255,0.1);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }
    .shell.sidebar-collapsed .home-sidebar { padding: 0; border-right: 0; visibility: hidden; }
    .shell.guest .home-sidebar { display: none; }
    .sidebar-open {
      position: fixed;
      left: 14px;
      top: 14px;
      z-index: 40;
      min-width: 44px;
      height: 44px;
      padding: 0;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }
    .shell.sidebar-collapsed .sidebar-open { display: inline-flex; }
    .shell.guest .sidebar-open { display: none; }
    .sidebar-top, .sidebar-user { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #44ffb0; box-shadow: 0 0 12px #44ffb0; }
    .sidebar-action, .chat-row {
      width: 100%;
      border: 0;
      color: white;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      min-height: 36px;
      padding: 0 12px;
      text-align: left;
      cursor: pointer;
      font-weight: 600;
    }
    .sidebar-search { width: 100%; background: transparent; border: 0; color: #eef1ff; outline: none; font-size: 14px; }
    .sidebar-label { color: #a9b2dd; font-size: 13px; margin: 12px 4px 4px; }
    .recent-list { display: grid; gap: 4px; overflow-y: auto; min-height: 0; }
    .chat-row { border-radius: 10px; background: transparent; position: relative; padding-right: 38px; }
    .chat-row:hover { background: rgba(255,255,255,0.09); }
    .chat-title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .delete-chat-inline { position: absolute; right: 4px; width: 28px; height: 28px; min-width: 28px; padding: 0; background: transparent; }
    .sidebar-user { margin-top: auto; min-height: 38px; }
    .main { grid-column: 2; min-width: 0; display: grid; place-items: center; padding: 24px; }
    .shell.guest .main { grid-column: 1; }
    .card {
      width: min(740px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      padding: 30px 26px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(30px, 5vw, 50px); }
    p { margin: 0 0 18px; color: #a9b2dd; }
    .welcome { color: #a9b2dd; font-size: 14px; margin-bottom: 10px; }
    .start { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; }
    @media (max-width: 820px) { .shell, .shell.sidebar-collapsed { grid-template-columns: 1fr; } .home-sidebar { display: none; } .sidebar-open { display: none !important; } .main { grid-column: 1; } .start { grid-template-columns: 1fr; } }
    input {
      background: #111533;
      color: #eef1ff;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }
    button, a.btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      color: white;
      text-decoration: none;
      text-align: center;
      font-weight: 600;
      background: linear-gradient(120deg, #7c5cff, #24d2ff);
      cursor: pointer;
    }
    a.btn.secondary { background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <div class="shell guest" id="homeShell">
    <button id="homeSidebarOpenBtn" class="sidebar-open" type="button" title="Open chats">☰</button>
    <aside class="home-sidebar" id="homeSidebar">
      <div class="sidebar-top">
        <div class="sidebar-logo"><span class="dot"></span><span>Owen AI</span></div>
        <button id="homeSidebarCloseBtn" type="button" title="Close sidebar">×</button>
      </div>
      <button class="sidebar-action" type="button" onclick="newChatFromSidebar()">✎ New chat</button>
      <label class="sidebar-action">⌕ <input id="chatSearch" class="sidebar-search" placeholder="Search chats" oninput="renderHomeChats()" /></label>
      <div class="sidebar-label">Recents</div>
      <div id="recentChatList" class="recent-list"></div>
      <div class="sidebar-user"><span>●</span><span id="sidebarUserName">Guest</span></div>
    </aside>
    <main class="main">
      <div class="card">
        <h1>Welcome to Owen.Ai</h1>
        <p id="homeSubtext">Chat as a guest instantly, or login/signup from the separate account page.</p>
        <div class="welcome" id="welcomeHome"></div>
        <div class="start">
          <input id="startInput" placeholder="Start a new chat..." onkeydown="if(event.key==='Enter') goChat();" />
          <button onclick="goChat()">Chat now</button>
          <a class="btn secondary" id="loginLink" href="/login">Login / Sign up</a>
        </div>
      </div>
    </main>
  </div>
  <script>
    const currentUser = localStorage.getItem("owen_user") || "";
    const currentName = localStorage.getItem("owen_user_name") || currentUser;

    function historyKey() { return `owen_chats_${currentUser}`; }
    function chatsIndexKey() { return `owen_chat_index_${currentUser}`; }
    function activeChatKey() { return `owen_active_chat_${currentUser}`; }
    function getChatIndex() {
      try { return JSON.parse(localStorage.getItem(chatsIndexKey()) || "[]"); } catch { return []; }
    }
    function saveChatIndex(index) { localStorage.setItem(chatsIndexKey(), JSON.stringify(index)); }
    function createChatRecord(title = "New chat") {
      const id = `chat_${Date.now()}`;
      const index = getChatIndex();
      index.unshift({ id, title, updatedAt: Date.now() });
      saveChatIndex(index.slice(0, 30));
      const chats = JSON.parse(localStorage.getItem(historyKey()) || "{}");
      chats[id] = [];
      localStorage.setItem(historyKey(), JSON.stringify(chats));
      localStorage.setItem(activeChatKey(), id);
      return id;
    }
    function deleteChat(chatId, event) {
      if (event) event.stopPropagation();
      const index = getChatIndex().filter(chat => chat.id !== chatId);
      saveChatIndex(index);
      const chats = JSON.parse(localStorage.getItem(historyKey()) || "{}");
      delete chats[chatId];
      localStorage.setItem(historyKey(), JSON.stringify(chats));
      if (localStorage.getItem(activeChatKey()) === chatId) {
        if (index[0]) localStorage.setItem(activeChatKey(), index[0].id);
        else localStorage.removeItem(activeChatKey());
      }
      renderHomeChats();
    }
    function openChat(chatId) {
      localStorage.setItem(activeChatKey(), chatId);
      window.location.href = "/chat";
    }
    function renderHomeChats() {
      if (!currentUser) return;
      const list = document.getElementById("recentChatList");
      const search = document.getElementById("chatSearch").value.trim().toLowerCase();
      list.innerHTML = "";
      getChatIndex().forEach(chat => {
        if (search && !chat.title.toLowerCase().includes(search)) return;
        const row = document.createElement("button");
        row.className = "chat-row";
        row.type = "button";
        row.onclick = () => openChat(chat.id);
        const title = document.createElement("span");
        title.className = "chat-title-text";
        title.textContent = chat.title;
        const del = document.createElement("button");
        del.className = "delete-chat-inline";
        del.type = "button";
        del.textContent = "×";
        del.title = "Delete chat";
        del.onclick = event => deleteChat(chat.id, event);
        row.append(title, del);
        list.appendChild(row);
      });
    }
    function newChatFromSidebar() {
      if (currentUser) createChatRecord();
      window.location.href = "/chat";
    }
    function goChat() {
      const firstMessage = document.getElementById("startInput").value.trim();
      if (currentUser) createChatRecord(firstMessage ? firstMessage.slice(0, 28) : "New chat");
      if (firstMessage) localStorage.setItem("firstMessage", firstMessage);
      window.location.href = "/chat";
    }
    (function initHomeAuth() {
      const homeShell = document.getElementById("homeShell");
      document.getElementById("homeSidebarCloseBtn").addEventListener("click", () => homeShell.classList.add("sidebar-collapsed"));
      document.getElementById("homeSidebarOpenBtn").addEventListener("click", () => homeShell.classList.remove("sidebar-collapsed"));
      if (!currentUser) return;
      homeShell.classList.remove("guest");
      document.getElementById("welcomeHome").textContent = `Hi, ${currentName}`;
      document.getElementById("sidebarUserName").textContent = currentName;
      document.getElementById("homeSubtext").textContent = "Start a new chat or jump back into a recent one.";
      document.getElementById("loginLink").style.display = "none";
      renderHomeChats();
    })();
  </script>
</body>
</html>
